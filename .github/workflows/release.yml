name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test -race ./...
      - name: Run linter
        run: golangci-lint run

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build web
        run: cd web && npm run build

      - name: Test web
        run: cd web && npm run lint

  goreleaser:
    name: Goreleaser
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Build web
        run: cd web && npm run build

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        if: env.GPG_PRIVATE_KEY != ''
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_signing: true

      - name: Set up cosign
        if: env.COSIGN_PASSWORD != ''
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}

  docker:
    name: Docker
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and push images
        run: |
          docker pull ghcr.io/aeomar999/commpit/mocksms:${{ github.ref_name }}
          docker push ghcr.io/aeomar999/commpit/mocksms:${{ github.ref_name }}
          docker push ghcr.io/aeomar999/commpit/mocksms:latest

  homebrew:
    name: Homebrew
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aeomar999/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update formula
        run: |
          # Formula update handled by goreleaser's brew section
          echo "Homebrew formula update handled by goreleaser"

  scoop:
    name: Scoop
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aeomar999/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Update manifest
        run: |
          # Manifest update handled by goreleaser's scoop section
          echo "Scoop manifest update handled by goreleaser"

  notify:
    name: Notify
    needs: [goreleaser, docker, homebrew, scoop]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification
        if: success()
        run: |
          echo "Release completed successfully!"
          echo "Release URL: https://github.com/Aeomar999/CommPit/releases/tag/${{ github.ref_name }}"
      - name: Failure notification
        if: failure()
        run: |
          echo "Release failed!"
          exit 1