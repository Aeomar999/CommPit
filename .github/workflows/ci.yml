name: CI

on:
  push:
    branches: [main, 'milestone/*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Run Biome
        if: hashFiles('web/package.json') != ''
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
        if: hashFiles('web/package.json') != ''
        working-directory: web
      - run: bun run biome check .
        if: hashFiles('web/package.json') != ''
        working-directory: web

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run Go tests with race detector
        run: go test -race ./...

  test-web:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
        working-directory: web
      # Scoped to src/: web/e2e holds Playwright specs for the e2e job.
      - run: bun test src
        working-directory: web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v1
        if: hashFiles('web/package.json') != ''
        with:
          bun-version: latest
      - run: bun install
        if: hashFiles('web/package.json') != ''
        working-directory: web
      - run: bun run build
        if: hashFiles('web/package.json') != ''
        working-directory: web
      - run: go build -tags embed -o bin/mocksms ./cmd/mocksms
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mocksms-${{ runner.os }}
          path: bin/mocksms

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mocksms-Linux
          path: bin/
      - run: chmod +x bin/mocksms
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install snippet dependencies
        run: |
          npm ci --prefix examples/twilio/node
          pip install -r examples/twilio/python/requirements.txt
          composer install --working-dir=examples/twilio/php --no-interaction --no-progress
          dotnet restore examples/twilio/csharp
      - name: Start mocksms
        run: |
          bin/mocksms --otp-code 123456 serve &
          sleep 3
          curl -f http://127.0.0.1:4010/healthz
      - name: Run real-SDK examples
        run: go test -v -tags e2e ./examples/...
        env:
          OTP_CODE: '123456'
      - name: Run Playwright tests
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
        working-directory: web
      # Scoped to src/: web/e2e holds Playwright specs for the e2e job below.
      - run: bun test src
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          MOCKSMS_URL: http://127.0.0.1:4010