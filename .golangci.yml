version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - copyloopvar
    - predeclared
    - errorlint
    - gosec
    - nolintlint
    - misspell
    - whitespace
    - goconst
    - gocritic
    - revive
  # depguard disabled temporarily - will be re-enabled with proper rules in M1-F13
  # - depguard

linters-settings:
  gosec:
    excludes:
      - G104 # Errors unhandled (we handle errors explicitly)
      - G115 # Integer overflow conversion (false positives)

  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveInsteadOfStutters
      - name: package-comments
        disabled: false
      - name: var-naming
        disabled: false
      - name: early-return
        disabled: false
      - name: error-strings
        disabled: false
      - name: error-naming
        disabled: false
      - name: error-return
        disabled: false
      - name: unhandled-error
        disabled: false
      - name: unused-parameter
        disabled: false
      - name: unreachable-code
        disabled: false
      - name: superfluous-else
        disabled: false
      - name: redefines-builtin-id
        disabled: false
      - name: constant-logical-expr
        disabled: false
      - name: waitgroup-by-value
        disabled: false
      - name: empty-block
        disabled: false

  govet:
    enable:
      - shadow
      - structtag
      - nilfunc
      - httpresponse
      - loopclosure
      - lostcancel
      - printf
      - shifts
      - stdmethods
      - stringintconv
      - tests
      - unmarshal
      - unreachable
      - unsafeptr
      - unusedresult
      - unusedwrite

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - wrapperFunc
      - dupImport
      - deprecatedComment
      - commentFormatting
      - ifElseChain
      - singleCaseSwitch
      - sloppyReassign
      - sloppyTypeAssert
      - whyNoLint
      - unnecessaryBlock

  nolintlint:
    allow-leading-space: true
    require-explanation: true
    require-specific: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - goconst
        - revive
    - path: examples/
      linters:
        - gosec

formatters:
  enable:
    - gofmt
  exclusions:
    generated: true

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly