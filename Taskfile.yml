version: '3'

vars:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

tasks:
  dev:
    desc: Start Go server + Vite dev server with proxy
    cmds:
      - task: dev:go
      - task: dev:web
    silent: true

  dev:go:
    desc: Start Go server with live reload
    cmds:
      - air -c .air.toml
    silent: true

  dev:web:
    desc: Start Vite dev server
    dir: web
    cmds:
      - npm run dev
    silent: true

  test:
    desc: Run Go tests with -race, plus UI unit tests
    cmds:
      - go test -race ./...
      - task: test:web

  test:web:
    desc: Run UI unit tests
    dir: web
    cmds:
      - npm test

  lint:
    desc: Run golangci-lint (incl. depguard) + Biome
    cmds:
      - golangci-lint run
      - task: lint:web

  lint:web:
    desc: Run Biome on web/
    dir: web
    cmds:
      - npx biome check .

  generate:
    desc: Generate code from openapi/openapi.yaml (oapi-codegen + openapi-typescript)
    cmds:
      - go generate ./...
      - task: generate:web

  generate:web:
    desc: Generate TypeScript types from OpenAPI spec
    dir: web
    cmds:
      - npx openapi-typescript ../openapi/openapi.yaml -o src/lib/api.ts

  build:
    desc: Build UI, then Go binary with embedded UI
    cmds:
      - task: build:web
      - task: build:go

  build:web:
    desc: Build Vite production bundle
    dir: web
    cmds:
      - npm run build

  build:go:
    desc: Build Go binary with embedded web/dist
    cmds:
      - go build -tags embed -o bin/mocksms ./cmd/mocksms

  e2e:
    desc: Run real-SDK examples + Playwright against built binary
    cmds:
      - task: build
      - task: e2e:examples
      - task: e2e:playwright

  e2e:examples:
    desc: Run real-SDK integration examples
    cmds:
      - go test -v -tags e2e ./examples/...

  e2e:playwright:
    desc: Run Playwright tests against embedded UI
    dir: web
    cmds:
      - npx playwright test

  fmt:
    desc: Format Go and web code
    cmds:
      - gofmt -w .
      - task: fmt:web

  fmt:web:
    desc: Format web code with Biome
    dir: web
    cmds:
      - npx biome check --write .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ web/dist/
      - go clean -cache

  db:reset:
    desc: Delete SQLite database files
    cmds:
      - rm -f *.db *.db-wal *.db-shm